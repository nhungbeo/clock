<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng hồ thời gian hiện tại</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow">
        <div class="glow-circle glow-circle-pink"></div>
        <div class="glow-circle glow-circle-purple"></div>
        <div class="glow-circle glow-circle-blue"></div>
    </div>

    <div class="container">        
        <div class="timer">
            <div class="time-block">
                <span class="time hours">00</span>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <span class="time minutes">00</span>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
                <span class="time seconds">00</span>
            </div>
        </div>
        
        <div class="date-display">
            <span class="date">01/01/2025</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
